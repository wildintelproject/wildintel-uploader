<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 510" width="920" height="510" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The workflow</title>
  <desc id="d">First the study is defined: the research project, its trappers and their roles, the locations, the cameras and the SD cards. Then the locations are visited, and the visits to all of them are a revision. The SD cards collected give deployments; those of a revision are a collection, and the collections are uploaded.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569" /></marker></defs>
  <rect x="0" y="0" width="920" height="510" rx="18" fill="#ffffff" stroke="#d4d4d8" />
  <text x="30" y="40" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1">THE WORKFLOW, FROM THE STUDY TO THE UPLOAD</text>
  <rect x="20" y="60" width="880" height="120" rx="14" fill="#eff6ff" fill-opacity="0.45" stroke="#2563eb" stroke-dasharray="5 4" /><text x="36" y="82" font-size="11" font-weight="700" fill="#1d4ed8" letter-spacing="1">1 · THE STUDY</text>
  <rect x="20" y="210" width="880" height="120" rx="14" fill="#fffbeb" fill-opacity="0.45" stroke="#f59e0b" stroke-dasharray="5 4" /><text x="36" y="232" font-size="11" font-weight="700" fill="#b45309" letter-spacing="1">2 · THE FIELD WORK</text>
  <rect x="20" y="360" width="880" height="120" rx="14" fill="#ecfdf5" fill-opacity="0.45" stroke="#10b981" stroke-dasharray="5 4" /><text x="36" y="382" font-size="11" font-weight="700" fill="#047857" letter-spacing="1">3 · THE IMAGES</text>
  <rect x="30" y="96" width="148" height="70" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" /><text x="104.0" y="122" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Research project</text>
  <text x="104.0" y="141" font-size="11" fill="#1d4ed8" text-anchor="middle">what, where, who and how</text>
  <rect x="210" y="96" width="148" height="70" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" /><text x="284.0" y="122" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Trappers</text>
  <text x="284.0" y="141" font-size="11" fill="#1d4ed8" text-anchor="middle">who, and their roles</text>
  <rect x="390" y="96" width="148" height="70" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" /><text x="464.0" y="122" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Locations</text>
  <text x="464.0" y="141" font-size="11" fill="#1d4ed8" text-anchor="middle">where the cameras go</text>
  <rect x="570" y="96" width="148" height="70" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" /><text x="644.0" y="122" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">Cameras</text>
  <text x="644.0" y="141" font-size="11" fill="#1d4ed8" text-anchor="middle">created in the app</text>
  <rect x="750" y="96" width="148" height="70" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2" /><text x="824.0" y="122" font-size="15" font-weight="700" fill="#1e3a8a" text-anchor="middle">SD cards</text>
  <text x="824.0" y="141" font-size="11" fill="#1d4ed8" text-anchor="middle">created in the app</text>
  <rect x="30" y="246" width="280" height="70" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2" /><text x="170.0" y="272" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Visit</text>
  <text x="170.0" y="291" font-size="11" fill="#b45309" text-anchor="middle">one trip to one location: install,</text>
  <text x="170.0" y="305" font-size="11" fill="#b45309" text-anchor="middle">revise, take away…</text>
  <rect x="342" y="246" width="280" height="70" rx="12" fill="#ffffff" stroke="#f59e0b" stroke-width="2" /><text x="482.0" y="272" font-size="15" font-weight="700" fill="#92400e" text-anchor="middle">Revision</text>
  <text x="482.0" y="291" font-size="11" fill="#b45309" text-anchor="middle">the visits to all the locations</text>
  <text x="482.0" y="305" font-size="11" fill="#b45309" text-anchor="middle">of a research project</text>
  <rect x="30" y="396" width="250" height="70" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" /><text x="155.0" y="422" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">Deployment</text>
  <text x="155.0" y="441" font-size="11" fill="#047857" text-anchor="middle">the images of a collected SD card,</text>
  <text x="155.0" y="455" font-size="11" fill="#047857" text-anchor="middle">at a location, in some conditions</text>
  <rect x="312" y="396" width="250" height="70" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" /><text x="437.0" y="422" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">Collection</text>
  <text x="437.0" y="441" font-size="11" fill="#047857" text-anchor="middle">all the deployments</text>
  <text x="437.0" y="455" font-size="11" fill="#047857" text-anchor="middle">of a revision</text>
  <rect x="594" y="396" width="296" height="70" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" /><text x="742.0" y="422" font-size="15" font-weight="700" fill="#065f46" text-anchor="middle">Upload</text>
  <text x="742.0" y="441" font-size="11" fill="#047857" text-anchor="middle">to Trapper, or to the portals</text>
  <text x="742.0" y="455" font-size="11" fill="#047857" text-anchor="middle">of camera trapping to come</text>
  <path d="M178 131 H208" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <path d="M358 131 H388" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <path d="M538 131 H568" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <path d="M718 131 H748" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <path d="M824 166 V195 H240 V244" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="482.8" y="185" width="128.39999999999998" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="547" y="199" font-size="11" fill="#475569" text-anchor="middle">everything is ready</text>
  <path d="M310 281 H340" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <path d="M482 316 V345 H230 V394" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="293.4" y="335" width="145.2" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="366" y="349" font-size="11" fill="#475569" text-anchor="middle">the SD cards collected</text>
  <path d="M280 431 H310" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <path d="M562 431 H592" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
</svg>
