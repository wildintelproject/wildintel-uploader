<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 346" width="920" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The life of a trapper</title>
  <desc id="d">An inactive trapper keeps what it did: its visits and roles still say who it is. Archived is final: it never goes back.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569" /></marker></defs>
  <rect x="0" y="0" width="920" height="346" rx="18" fill="#ffffff" stroke="#d4d4d8" />
  <text x="30" y="40" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1">THE LIFE OF A TRAPPER</text>
  <rect x="110" y="110" width="140" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" /><text x="180.0" y="140" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Active</text>
  <text x="180.0" y="162" font-size="11" fill="#047857" text-anchor="middle">goes to the field:</text>
  <text x="180.0" y="177" font-size="11" fill="#047857" text-anchor="middle">suggested in the visits</text>
  <rect x="390" y="110" width="140" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" /><text x="460.0" y="140" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">Inactive</text>
  <text x="460.0" y="162" font-size="11" fill="#b45309" text-anchor="middle">no longer goes:</text>
  <text x="460.0" y="177" font-size="11" fill="#b45309" text-anchor="middle">not suggested</text>
  <rect x="670" y="110" width="140" height="90" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" /><text x="740.0" y="140" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">Archived</text>
  <text x="740.0" y="162" font-size="11" fill="#475569" text-anchor="middle">out of use</text>
  <text x="740.0" y="177" font-size="11" fill="#475569" text-anchor="middle">for good</text>
  <path d="M250 155 H390" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="278.2" y="134" width="83.6" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="320.0" y="148" font-size="11" fill="#475569" text-anchor="middle">by settings</text>
  <path d="M180.0 110 V102 Q180.0 90 192.0 90 H728.0 Q740.0 90 740.0 102 V106" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="373.4" y="80" width="173.2" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="460.0" y="94" font-size="11" fill="#475569" text-anchor="middle">by settings, from any state</text>
  <path d="M440.0 200 V222 Q440.0 234 428.0 234 H212.0 Q200.0 234 200.0 222 V202" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="278.2" y="224" width="83.6" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="320.0" y="238" font-size="11" fill="#475569" text-anchor="middle">by settings</text>
  <text x="30" y="280" font-size="12" fill="#64748b">An inactive trapper keeps what it did: its visits and roles still say who it is. Archived is final: it never goes</text>
  <text x="30" y="298" font-size="12" fill="#64748b">back.</text>
</svg>
