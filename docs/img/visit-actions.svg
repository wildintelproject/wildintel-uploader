<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The actions of a visit</title>
  <desc id="d">A planned visit becomes deployed when its action is an Installation, and not visited when no action is done. A deployed visit becomes collected when the next visit to the site does a Revision or a Desinstallation, and stolen when the next visit does a Stolen action. An Archive goes with a Desinstallation or a Stolen visit.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="400" rx="18" fill="#ffffff" stroke="#d4d4d8" />
  <text x="40" y="42" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1">THE ACTIONS OF A VISIT</text>

  <text x="30" y="84" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">WHEN IT IS REGISTERED</text>
  <text x="370" y="84" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">ITS STATE</text>
  <text x="730" y="84" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">WHEN THE NEXT VISIT…</text>

  <!-- planned -->
  <rect x="30" y="172" width="160" height="76" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" />
  <text x="110" y="204" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">Planned</text>
  <text x="110" y="226" font-size="12" fill="#475569" text-anchor="middle">or Unknown</text>

  <!-- deployed / not visited -->
  <rect x="370" y="104" width="170" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
  <text x="455" y="136" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">Deployed</text>
  <text x="455" y="158" font-size="12" fill="#b45309" text-anchor="middle">a camera is out</text>
  <rect x="370" y="268" width="170" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
  <text x="455" y="300" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">Not visited</text>
  <text x="455" y="322" font-size="12" fill="#475569" text-anchor="middle">it could not be made</text>

  <path d="M190 198 H265 Q280 198 280 183 V157 Q280 142 295 142 H370" fill="none" stroke="#475569" stroke-width="2.500" marker-end="url(#a)" />
  <path d="M190 222 H265 Q280 222 280 237 V291 Q280 306 295 306 H370" fill="none" stroke="#475569" stroke-width="2.500" marker-end="url(#a)" />
  <rect x="235" y="160" width="90" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="280" y="174" font-size="11" fill="#475569" text-anchor="middle">Installation</text>
  <rect x="215" y="262" width="130" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="280" y="276" font-size="11" fill="#475569" text-anchor="middle">no action: not revised</text>

  <!-- later visits -->
  <rect x="730" y="104" width="160" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
  <text x="810" y="136" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Collected</text>
  <text x="810" y="158" font-size="12" fill="#047857" text-anchor="middle">its card was collected</text>
  <rect x="730" y="196" width="160" height="76" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
  <text x="810" y="228" font-size="17" font-weight="700" fill="#991b1b" text-anchor="middle">Stolen</text>
  <text x="810" y="250" font-size="12" fill="#b91c1c" text-anchor="middle">no images to import</text>

  <path d="M540 130 H730" fill="none" stroke="#475569" stroke-width="2.500" marker-end="url(#a)" />
  <path d="M540 160 H600 Q615 160 615 175 V219 Q615 234 630 234 H730" fill="none" stroke="#475569" stroke-width="2.500" marker-end="url(#a)" />
  <rect x="550" y="113" width="170" height="34" rx="12" fill="#ffffff" stroke="#cbd5e1" /><text x="635" y="127" font-size="11" fill="#475569" text-anchor="middle">does a Revision</text><text x="635" y="141" font-size="11" fill="#475569" text-anchor="middle">or a Desinstallation</text>
  <rect x="632" y="198" width="86" height="34" rx="12" fill="#ffffff" stroke="#cbd5e1" /><text x="675" y="212" font-size="11" fill="#475569" text-anchor="middle">does a</text><text x="675" y="226" font-size="11" fill="#475569" text-anchor="middle">Stolen</text>

  <text x="40" y="378" font-size="12" fill="#64748b">An Archive goes with a Desinstallation or a Stolen visit: it gives the site up.</text>
</svg>
