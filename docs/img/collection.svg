  <use href="#done" x="750" y="214" />
  <rect x="278" y="200" width="204" height="28" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" /><text x="380" y="218" font-size="11" fill="#065f46" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">R0001-WICP_02_002</text>
  <rect x="528" y="200" width="204" height="28" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" /><text x="630" y="218" font-size="11" fill="#065f46" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">R0002-WICP_02_002</text>
  <text x="40" y="266" font-size="13" font-weight="600" fill="#334155" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">WICP_02_003</text>
  <line x1="30" y1="286" x2="890" y2="286" stroke="#e2e8f0" />
  <use href="#done" x="250" y="262" />
