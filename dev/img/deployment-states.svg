<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 346" width="920" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The life of a deployment</title>
  <desc id="d">A deployment is open from the visit that leaves the camera until the next visit to the site, and it is closed by what that visit finds. Closed and Camera stolen are final.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569" /></marker></defs>
  <rect x="0" y="0" width="920" height="346" rx="18" fill="#ffffff" stroke="#d4d4d8" />
  <text x="30" y="40" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1">THE LIFE OF A DEPLOYMENT</text>
  <rect x="40" y="110" width="140" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" /><text x="110.0" y="140" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">Open</text>
  <text x="110.0" y="162" font-size="11" fill="#b45309" text-anchor="middle">the camera is out:</text>
  <text x="110.0" y="177" font-size="11" fill="#b45309" text-anchor="middle">card to be collected</text>
  <rect x="390" y="110" width="140" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" /><text x="460.0" y="140" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Closed</text>
  <text x="460.0" y="162" font-size="11" fill="#047857" text-anchor="middle">card collected:</text>
  <text x="460.0" y="177" font-size="11" fill="#047857" text-anchor="middle">images can be imported</text>
  <rect x="740" y="110" width="140" height="90" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2" /><text x="810.0" y="140" font-size="17" font-weight="700" fill="#991b1b" text-anchor="middle">Camera stolen</text>
  <text x="810.0" y="162" font-size="11" fill="#b91c1c" text-anchor="middle">closed:</text>
  <text x="810.0" y="177" font-size="11" fill="#b91c1c" text-anchor="middle">it has no images</text>
  <path d="M180 155 H390" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="201.2" y="134" width="167.6" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="285.0" y="148" font-size="11" fill="#475569" text-anchor="middle">next visit: card collected</text>
  <path d="M110.0 110 V102 Q110.0 90 122.0 90 H798.0 Q810.0 90 810.0 102 V106" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="362.2" y="80" width="195.6" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="460.0" y="94" font-size="11" fill="#475569" text-anchor="middle">next visit: camera found stolen</text>
  <text x="30" y="280" font-size="12" fill="#64748b">A deployment is open from the visit that leaves the camera until the next visit to the site, and it is closed by</text>
  <text x="30" y="298" font-size="12" fill="#64748b">what that visit finds. Closed and Camera stolen are final.</text>
</svg>
