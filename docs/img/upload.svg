<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 346" width="920" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The life of a deployment, in an upload</title>
  <desc id="d">It is said for each portal: a deployment can be uploaded to one and not to another. A rehearse, only preparing the files, or an upload that fails leave it as it was.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569" /></marker></defs>
  <rect x="0" y="0" width="920" height="346" rx="18" fill="#ffffff" stroke="#d4d4d8" />
  <text x="30" y="40" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1">THE LIFE OF A DEPLOYMENT, IN AN UPLOAD</text>
  <rect x="200" y="110" width="140" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" /><text x="270.0" y="140" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">Not uploaded</text>
  <text x="270.0" y="162" font-size="11" fill="#b45309" text-anchor="middle">created here, not yet</text>
  <text x="270.0" y="177" font-size="11" fill="#b45309" text-anchor="middle">in the portal</text>
  <rect x="580" y="110" width="140" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" /><text x="650.0" y="140" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Uploaded</text>
  <text x="650.0" y="162" font-size="11" fill="#047857" text-anchor="middle">in the portal:</text>
  <text x="650.0" y="177" font-size="11" fill="#047857" text-anchor="middle">the day is kept</text>
  <path d="M340 155 H580" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="395.8" y="134" width="128.39999999999998" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="460.0" y="148" font-size="11" fill="#475569" text-anchor="middle">an upload ends well</text>
  <text x="30" y="280" font-size="12" fill="#64748b">It is said for each portal: a deployment can be uploaded to one and not to another. A rehearse, only preparing the</text>
  <text x="30" y="298" font-size="12" fill="#64748b">files, or an upload that fails leave it as it was.</text>
</svg>
