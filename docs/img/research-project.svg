<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 346" width="920" height="346" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The life of a research project</title>
  <desc id="d">Only a project with no visits goes back to planned. A finished project is not offered when a deployment is imported, but can be reopened. Archived is final: nothing in it can be changed, and it never goes back.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569" /></marker></defs>
  <rect x="0" y="0" width="920" height="346" rx="18" fill="#ffffff" stroke="#d4d4d8" />
  <text x="30" y="40" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1">THE LIFE OF A RESEARCH PROJECT</text>
  <rect x="30" y="110" width="140" height="90" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" /><text x="100.0" y="140" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">Planned</text>
  <text x="100.0" y="162" font-size="11" fill="#b45309" text-anchor="middle">being prepared:</text>
  <text x="100.0" y="177" font-size="11" fill="#b45309" text-anchor="middle">no visits yet</text>
  <rect x="270" y="110" width="140" height="90" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" /><text x="340.0" y="140" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Active</text>
  <text x="340.0" y="162" font-size="11" fill="#047857" text-anchor="middle">the study</text>
  <text x="340.0" y="177" font-size="11" fill="#047857" text-anchor="middle">is running</text>
  <rect x="510" y="110" width="140" height="90" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2" /><text x="580.0" y="140" font-size="17" font-weight="700" fill="#1e3a8a" text-anchor="middle">Finished</text>
  <text x="580.0" y="162" font-size="11" fill="#1d4ed8" text-anchor="middle">the fieldwork</text>
  <text x="580.0" y="177" font-size="11" fill="#1d4ed8" text-anchor="middle">is over</text>
  <rect x="750" y="110" width="140" height="90" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" /><text x="820.0" y="140" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">Archived</text>
  <text x="820.0" y="162" font-size="11" fill="#475569" text-anchor="middle">out of use</text>
  <text x="820.0" y="177" font-size="11" fill="#475569" text-anchor="middle">for good</text>
  <path d="M170 155 H270" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="178.2" y="134" width="83.6" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="220.0" y="148" font-size="11" fill="#475569" text-anchor="middle">by settings</text>
  <path d="M410 155 H510" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="418.2" y="134" width="83.6" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="460.0" y="148" font-size="11" fill="#475569" text-anchor="middle">by settings</text>
  <path d="M650 155 H750" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="658.2" y="134" width="83.6" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="700.0" y="148" font-size="11" fill="#475569" text-anchor="middle">by settings</text>
  <path d="M100.0 110 V102 Q100.0 90 112.0 90 H808.0 Q820.0 90 820.0 102 V106" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="373.4" y="80" width="173.2" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="460.0" y="94" font-size="11" fill="#475569" text-anchor="middle">by settings, from any state</text>
  <path d="M560.0 200 V222 Q560.0 234 548.0 234 H372.0 Q360.0 234 360.0 222 V202" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="432.2" y="224" width="55.599999999999994" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="460.0" y="238" font-size="11" fill="#475569" text-anchor="middle">reopen</text>
  <path d="M320.0 200 V222 Q320.0 234 308.0 234 H132.0 Q120.0 234 120.0 222 V202" stroke="#475569" stroke-width="2.5" fill="none" marker-end="url(#a)" />
  <rect x="155.8" y="224" width="128.39999999999998" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="220.0" y="238" font-size="11" fill="#475569" text-anchor="middle">only with no visits</text>
  <text x="30" y="280" font-size="12" fill="#64748b">Only a project with no visits goes back to planned. A finished project is not offered when a deployment is</text>
  <text x="30" y="298" font-size="12" fill="#64748b">imported, but can be reopened. Archived is final: nothing in it can be changed, and it never goes back.</text>
</svg>
