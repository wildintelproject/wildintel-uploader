  <rect x="528" y="248" width="204" height="28" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4" /><text x="630" y="266" font-size="11" fill="#92400e" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">R0002-WICP_02_003</text>
  <text x="40" y="314" font-size="13" font-weight="600" fill="#334155" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">WICP_02_004</text>
  <use href="#done" x="250" y="310" />
  <use href="#done" x="500" y="310" />
  <use href="#planned" x="750" y="310" />
  <rect x="278" y="296" width="204" height="28" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" /><text x="380" y="314" font-size="11" fill="#065f46" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">R0001-WICP_02_004</text>
  <rect x="528" y="296" width="204" height="28" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4" /><text x="630" y="314" font-size="11" fill="#92400e" text-anchor="middle" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">R0002-WICP_02_004</text>
  <g font-size="12" fill="#475569">
    <rect x="40" y="386" width="26" height="14" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" /><text x="74" y="398">closed deployment: the next visit has collected its card</text>
    <rect x="440" y="386" width="26" height="14" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5 4" /><text x="474" y="398">open deployment: the card is still to be collected</text>
  </g>
  <text x="40" y="424" font-size="12" fill="#64748b">A deployment belongs to the revision of the visit that left the camera: R0001-WICP_02_001 is of R0001.</text>
