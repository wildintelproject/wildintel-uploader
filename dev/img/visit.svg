<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">A visit</title>
  <desc id="d">A person goes to a camera trap at a site; what happens is recorded as a visit: when, where, who went, what was done, the SD card, the camera and what was found.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="440" rx="18" fill="#ffffff" stroke="#d4d4d8" />

  <!-- the site -->
  <text x="40" y="44" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1">AT THE SITE</text>
  <rect x="30" y="58" width="360" height="296" rx="14" fill="#f4f8ff" stroke="#bfdbfe" />
  <!-- sky and ground -->
  <circle cx="345" cy="100" r="22" fill="#fde68a" />
  <path d="M30 300 H390 V340 a14 14 0 0 1 -14 14 H44 a14 14 0 0 1 -14 -14 z" fill="#bbf7d0" />
  <path d="M30 300 H390" stroke="#86efac" stroke-width="2" />
  <!-- tree -->
  <rect x="226" y="140" width="26" height="160" rx="4" fill="#a16207" />
  <circle cx="239" cy="118" r="52" fill="#4ade80" />
  <circle cx="204" cy="140" r="34" fill="#22c55e" />
  <circle cx="276" cy="138" r="34" fill="#22c55e" />
  <!-- camera on the trunk -->
  <rect x="204" y="196" width="46" height="34" rx="6" fill="#1f2937" />
  <circle cx="227" cy="213" r="9" fill="#0ea5e9" stroke="#e5e7eb" stroke-width="2" />
  <circle cx="227" cy="213" r="3.500" fill="#082f49" />
  <rect x="212" y="190" width="14" height="6" rx="2" fill="#374151" />
  <!-- sd card -->
  <g transform="translate(262 226) rotate(8)">
    <path d="M0 0 h24 l10 10 v26 a3 3 0 0 1 -3 3 h-31 a3 3 0 0 1 -3 -3 v-33 a3 3 0 0 1 3 -3 z" fill="#f59e0b" stroke="#b45309" stroke-width="1.500" />
    <path d="M5 4 v8 M10 4 v8 M15 4 v8 M20 4 v8" stroke="#b45309" stroke-width="2" stroke-linecap="round" />
    <text x="14" y="30" font-size="9" font-weight="700" fill="#78350f" text-anchor="middle">SD</text>
  </g>
  <!-- the person -->
  <circle cx="108" cy="222" r="15" fill="#fcd34d" stroke="#92400e" stroke-width="2" />
  <path d="M90 300 V258 a18 18 0 0 1 36 0 V300" fill="#2563eb" />
  <path d="M126 262 L178 238" stroke="#2563eb" stroke-width="9" stroke-linecap="round" />
  <circle cx="182" cy="236" r="6" fill="#fcd34d" stroke="#92400e" stroke-width="1.500" />
  <path d="M96 300 V322 M120 300 V322" stroke="#1e3a8a" stroke-width="9" stroke-linecap="round" />
  <!-- labels -->
  <text x="108" y="342" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">who went</text>
  <text x="239" y="342" font-size="13" font-weight="600" fill="#14532d" text-anchor="middle">camera trap + SD card</text>
  <text x="46" y="84" font-size="13" font-weight="600" fill="#1e40af">a site (a location)</text>

  <!-- arrow -->
  <path d="M404 206 H476" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)" />
  <text x="440" y="190" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">is recorded</text>
  <text x="440" y="228" font-size="13" font-weight="600" fill="#2563eb" text-anchor="middle">as a visit</text>

  <!-- the record -->
  <text x="500" y="44" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1">THE VISIT</text>
  <rect x="490" y="58" width="400" height="296" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="2" />
  <rect x="490" y="58" width="400" height="38" rx="14" fill="#2563eb" />
  <rect x="490" y="82" width="400" height="14" fill="#2563eb" />
  <text x="510" y="84" font-size="15" font-weight="700" fill="#ffffff">One trip to one camera trap</text>
  <g font-size="13">
    <g transform="translate(510 124)"><text font-weight="700" fill="#334155">When</text><text x="124" fill="#475569">2026-10-19, 08:30 (clock of the site)</text></g>
    <line x1="510" y1="136" x2="870" y2="136" stroke="#e2e8f0" />
    <g transform="translate(510 160)"><text font-weight="700" fill="#334155">Where</text><text x="124" fill="#475569">site WICP_02_001, revision R0002</text></g>
    <line x1="510" y1="172" x2="870" y2="172" stroke="#e2e8f0" />
    <g transform="translate(510 196)"><text font-weight="700" fill="#334155">Who went</text><text x="124" fill="#475569">Luis Gómez</text></g>
    <line x1="510" y1="208" x2="870" y2="208" stroke="#e2e8f0" />
    <g transform="translate(510 232)"><text font-weight="700" fill="#334155">What was done</text><text x="124" fill="#475569">Revision: card collected, another left</text></g>
    <line x1="510" y1="244" x2="870" y2="244" stroke="#e2e8f0" />
    <g transform="translate(510 268)"><text font-weight="700" fill="#334155">The SD card</text><text x="124" fill="#475569">left: 5 · photos collected: 1420 · card OK</text></g>
    <line x1="510" y1="280" x2="870" y2="280" stroke="#e2e8f0" />
    <g transform="translate(510 304)"><text font-weight="700" fill="#334155">The camera</text><text x="124" fill="#475569">SP1776213899 · status OK · clock right</text></g>
    <line x1="510" y1="316" x2="870" y2="316" stroke="#e2e8f0" />
    <g transform="translate(510 340)"><text font-weight="700" fill="#334155">What was found</text><text x="124" fill="#475569" font-style="italic">notes: "Card changed"</text></g>
  </g>

  <!-- footer -->
  <rect x="30" y="378" width="860" height="40" rx="10" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="460" y="403" font-size="14" fill="#1e3a8a" text-anchor="middle">The visits are the field record: the revisions, the states and the deployments are all worked out from them.</text>
</svg>
