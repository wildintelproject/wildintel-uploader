<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 436" width="920" height="436" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">A collection</title>
  <desc id="d">A collection is the name of a revision: all the deployments between the visits of that revision and the visits of the next one, one for each site. The deployment of a site belongs to the revision of the visit that left the camera. A deployment is closed when the next visit has collected its card, and open while it has not.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569" />
    </marker>
    <g id="done">
      <circle r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
      <path d="M-7 0 l5 5 l9 -10" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <g id="planned"><circle r="15" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4 4" /></g>
  </defs>
  <rect x="0" y="0" width="920" height="436" rx="18" fill="#ffffff" stroke="#d4d4d8" />

  <text x="40" y="42" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1">A COLLECTION IS ALL THE DEPLOYMENTS OF A REVISION</text>
  <rect x="266" y="62" width="218" height="278" rx="12" fill="#eff6ff" stroke="#bfdbfe" />
  <rect x="516" y="62" width="218" height="278" rx="12" fill="#eff6ff" stroke="#bfdbfe" />
  <g font-size="16" font-weight="700" text-anchor="middle" fill="#1e3a8a"><text x="375" y="90">Collection R0001</text><text x="625" y="90">Collection R0002</text></g>
  <g font-size="12" text-anchor="middle" fill="#475569"><text x="375" y="108">all closed</text><text x="625" y="108">2 closed, 2 open</text></g>
  <g font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1"><text x="250" y="360">visits R0001</text><text x="500" y="360">visits R0002</text><text x="750" y="360">visits R0003</text></g>

  <text x="40" y="170" font-size="13" font-weight="600" fill="#334155" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace">WICP_02_001</text>
  <line x1="30" y1="190" x2="890" y2="190" stroke="#e2e8f0" />
  <use href="#done" x="250" y="166" />
  <use href="#done" x="500" y="166" />
  <use href="#done" x="750" y="166" />
