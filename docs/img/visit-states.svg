<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="920" height="540" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="t">The states of a visit</title>
  <desc id="d">A visit is planned, or unknown, until it is registered. A visit that left a camera is deployed; when a later visit collects its card it is collected, and when a later visit finds the camera stolen it is stolen. A visit that could not be made is not visited, and a visit that left no camera has no state.</desc>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569" />
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="540" rx="18" fill="#ffffff" stroke="#d4d4d8" />
  <text x="40" y="42" font-size="15" font-weight="700" fill="#2563eb" letter-spacing="1">THE STATES OF A VISIT</text>

  <text x="40" y="84" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">BEFORE IT IS REGISTERED</text>
  <text x="520" y="84" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">WHAT THE VISIT DID</text>
  <text x="720" y="84" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1">WHEN A LATER VISIT…</text>

  <!-- before it is made -->
  <rect x="30" y="104" width="170" height="76" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 5" />
  <text x="115" y="136" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">Planned</text>
  <text x="115" y="158" font-size="12" fill="#475569" text-anchor="middle">not made yet</text>
  <rect x="30" y="300" width="170" height="76" rx="12" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2" stroke-dasharray="6 5" />
  <text x="115" y="332" font-size="17" font-weight="700" fill="#5b21b6" text-anchor="middle">Unknown</text>
  <text x="115" y="354" font-size="12" fill="#6d28d9" text-anchor="middle">nothing is known of it</text>

  <!-- registered -->
  <rect x="262" y="210" width="150" height="68" rx="34" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text x="337" y="239" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">The visit is</text>
  <text x="337" y="258" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">registered</text>
  <path d="M115 180 V212 Q115 232 150 232 H262" fill="none" stroke="#475569" stroke-width="2.500" marker-end="url(#a)" />
  <path d="M115 300 V276 Q115 256 150 256 H262" fill="none" stroke="#475569" stroke-width="2.500" marker-end="url(#a)" />
  <rect x="77" y="195" width="76" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="115" y="210" font-size="11" fill="#475569" text-anchor="middle">it is made</text>
  <rect x="62" y="271" width="106" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="115" y="286" font-size="11" fill="#475569" text-anchor="middle">it is filled in</text>

  <!-- what it did -->
  <rect x="470" y="104" width="170" height="76" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
  <text x="555" y="136" font-size="17" font-weight="700" fill="#92400e" text-anchor="middle">Deployed</text>
  <text x="555" y="158" font-size="12" fill="#b45309" text-anchor="middle">a camera is out</text>
  <path d="M412 232 H440 Q455 232 455 217 V152 Q455 142 470 142" fill="none" stroke="#475569" stroke-width="2.500" marker-end="url(#a)" />
  <rect x="408" y="177" width="94" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="455" y="192" font-size="11" fill="#475569" text-anchor="middle">left a camera</text>

  <rect x="470" y="214" width="170" height="68" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 5" />
  <text x="555" y="240" font-size="14" font-weight="700" fill="#475569" text-anchor="middle">No state</text>
  <text x="555" y="259" font-size="11" fill="#64748b" text-anchor="middle">left no camera: Desinstallation,</text>
  <text x="555" y="273" font-size="11" fill="#64748b" text-anchor="middle">Stolen or Archive</text>
  <path d="M412 248 H470" fill="none" stroke="#475569" stroke-width="2.500" marker-end="url(#a)" />

  <rect x="470" y="316" width="170" height="76" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" />
  <text x="555" y="348" font-size="17" font-weight="700" fill="#334155" text-anchor="middle">Not visited</text>
  <text x="555" y="370" font-size="12" fill="#475569" text-anchor="middle">it could not be made</text>
  <path d="M412 264 H440 Q455 264 455 279 V346 Q455 354 470 354" fill="none" stroke="#475569" stroke-width="2.500" marker-end="url(#a)" />
  <rect x="414" y="301" width="82" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="455" y="316" font-size="11" fill="#475569" text-anchor="middle">not revised</text>

  <!-- later visits -->
  <rect x="720" y="104" width="170" height="76" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
  <text x="805" y="136" font-size="17" font-weight="700" fill="#065f46" text-anchor="middle">Collected</text>
  <text x="805" y="158" font-size="12" fill="#047857" text-anchor="middle">its card was collected</text>
  <path d="M640 142 H720" fill="none" stroke="#475569" stroke-width="2.500" marker-end="url(#a)" />
  <rect x="621" y="113" width="119" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="680" y="128" font-size="11" fill="#475569" text-anchor="middle">collects its card</text>

  <rect x="720" y="206" width="170" height="62" rx="12" fill="#ffffff" stroke="#10b981" stroke-width="2" />
  <circle cx="744" cy="237" r="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <path d="M739 237 l4 4 l7 -8" fill="none" stroke="#15803d" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round" />
  <text x="764" y="231" font-size="12" font-weight="700" fill="#065f46">Images stored</text>
  <text x="764" y="247" font-size="11" fill="#047857">when its deployment</text><text x="764" y="260" font-size="11" fill="#047857">is made</text>
  <path d="M805 180 V206" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="5 4" />

  <rect x="720" y="316" width="170" height="76" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="2" />
  <text x="805" y="348" font-size="17" font-weight="700" fill="#991b1b" text-anchor="middle">Stolen</text>
  <text x="805" y="370" font-size="12" fill="#b91c1c" text-anchor="middle">no images to import</text>
  <path d="M640 168 Q682 168 682 205 V338 Q682 354 720 354" fill="none" stroke="#475569" stroke-width="2.500" marker-end="url(#a)" />
  <rect x="604" y="296" width="156" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" /><text x="682" y="311" font-size="11" fill="#475569" text-anchor="middle">finds the camera stolen</text>

  <!-- notes -->
  <rect x="30" y="418" width="860" height="94" rx="12" fill="#eff6ff" stroke="#bfdbfe" />
  <g font-size="13" fill="#1e3a8a">
    <text x="50" y="446" font-weight="700">The deployment of a visit is open while its camera is out (Deployed)</text>
    <text x="50" y="468" fill="#334155">and closed when a later visit to the site collects its card (Collected) or finds the camera stolen (Stolen).</text>
    <text x="50" y="490" fill="#334155">Whether its images are stored is told apart, by the tick in the Images column — it is not a state of the visit.</text>
  </g>
</svg>
